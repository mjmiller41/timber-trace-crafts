<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 32" preserveAspectRatio="xMidYMid meet">
  <!--
    Laser-cut fretwork divider tile (seamless repeat-x).
    Solid (filled) area = the wood that remains; the pierced shapes are cut away.
    Authored to tile cleanly: the left/right edges are solid so repeats butt together.
    Designed as a CSS mask source — fill is opaque; evenodd punches the holes.
  -->
  <path fill="#000" fill-rule="evenodd" d="
    M0 0 H96 V32 H0 Z
    M48 4 C 58 12, 58 20, 48 28 C 38 20, 38 12, 48 4 Z
    M19 16 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0 Z
    M67 16 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0 Z
    M0 16 L 8 9 L 8 23 Z
    M96 16 L 88 9 L 88 23 Z
  "/>
</svg>
